name: Build QuestionHub Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build desktop app
        run: mvn -B -f desktop-app/pom.xml clean test package

      - name: Prepare jpackage input
        run: |
          New-Item -ItemType Directory -Force desktop-app/target/app | Out-Null
          Copy-Item desktop-app/target/questionhub-desktop.jar desktop-app/target/app/questionhub-desktop.jar -Force

      - name: Verify launcher and icon assets
        run: |
          $entries = jar tf desktop-app/target/questionhub-desktop.jar
          if ($entries -notcontains 'com/questionhub/desktop/Launcher.class') {
            throw 'Launcher.class is missing from questionhub-desktop.jar'
          }
          if ($entries -notcontains 'app-icon.png') {
            throw 'app-icon.png is missing from questionhub-desktop.jar'
          }
          if (-not (Test-Path 'desktop-app/src/main/resources/app-icon.ico')) {
            throw 'app-icon.ico is missing'
          }

      - name: Build app image with bundled Java runtime
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if (-not $version -or $version -eq '${{ github.ref_name }}') { $version = '1.0.1' }
          jpackage `
            --type app-image `
            --name QuestionHub `
            --dest desktop-app/target/jpackage `
            --input desktop-app/target/app `
            --main-jar questionhub-desktop.jar `
            --main-class com.questionhub.desktop.Launcher `
            --icon desktop-app/src/main/resources/app-icon.ico `
            --app-version $version `
            --vendor flankerLym `
            --java-options "-Dfile.encoding=UTF-8"

      - name: Verify native launcher config
        run: |
          $cfg = Get-Content desktop-app/target/jpackage/QuestionHub/app/QuestionHub.cfg -Raw
          if ($cfg -notmatch 'app.mainclass=com\.questionhub\.desktop\.Launcher') {
            throw 'jpackage did not use the bootstrap Launcher as the native main class'
          }
          if (-not (Test-Path 'desktop-app/target/jpackage/QuestionHub/QuestionHub.exe')) {
            throw 'QuestionHub.exe was not generated'
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if (-not $version -or $version -eq '${{ github.ref_name }}') { $version = '1.0.1' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "desktop-app\installer\QuestionHub.iss"

      - name: Build portable ZIP
        run: |
          Compress-Archive -Path desktop-app/target/jpackage/QuestionHub -DestinationPath desktop-app/target/QuestionHub-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestionHub-Windows
          path: |
            desktop-app/target/installer/*.exe
            desktop-app/target/QuestionHub-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-app/target/installer/*.exe
            desktop-app/target/QuestionHub-Windows-x64.zip
          generate_release_notes: true
